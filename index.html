<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Práctica 1.4 | Escenarios interactivos</title>


    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- CSS del proyecto -->
    <link
        rel="stylesheet"
        href="./assets/css/styles.css"
    >


    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
    }
    </script>

</head>


<body>

    <!-- ==========================================
         CONTENEDOR DEL ESCENARIO 3D
    =========================================== -->

    <div id="scene-container"></div>


    <!-- ==========================================
         MIRA
    =========================================== -->

    <div class="crosshair">+</div>


    <!-- ==========================================
         HUD
    =========================================== -->

    <section
        class="hud card border-0 shadow-lg text-white p-3"
    >

        <h1 class="h5 mb-2">
            Escenarios interactivos
        </h1>

        <p class="small mb-2">
            Haz clic en el escenario para activar el mouse.
        </p>


        <div class="d-flex flex-wrap gap-2 small">

            <span>
                <kbd class="key">WASD</kbd>
                Mover
            </span>

            <span>
                <kbd class="key">SPACE</kbd>
                Saltar
            </span>

            <span>
                <kbd class="key">CLICK</kbd>
                Láser
            </span>

            <span>
                <kbd class="key">ESC</kbd>
                Liberar mouse
            </span>

        </div>


        <div class="mt-2 small">
            Objetivo: derribar y desplazar objetos 3D.
        </div>

    </section>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="app-footer text-center py-2 px-3">

        Programador: Derek Alejandro Vargas Meneses ·
        No. de control: 22200792 ·
        Desarrollo de Soluciones en Ambientes Virtuales

    </footer>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script
        type="module"
        src="./assets/js/main.js">
    </script>

</body>

</html>
